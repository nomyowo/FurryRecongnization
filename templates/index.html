{% extends "base.html" %}
{% block content %}
<div class="row g-4 mt-3">
    <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
                <i class="bi bi-images fs-1 text-primary mb-3"></i>
                <h3 class="card-title">训练图库</h3>
                <p class="card-text text-muted">将单人兽装照上传至系统并添加标签，供分类器训练</p>
                <a href="/lib" class="btn btn-primary">跳转至训练图库</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
                <i class="bi bi-bullseye fs-1 text-warning mb-3"></i>
                <h3 class="card-title">单目标预测</h3>
                <p class="card-text text-muted">适用于个人从多张图片中筛选出自己的一张</p>
                <a href="/target" class="btn btn-warning">跳转至单目标预测</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
                <i class="bi bi-search fs-1 text-success mb-3"></i>
                <h3 class="card-title">多目标预测</h3>
                <p class="card-text text-muted">适用于兽展、小聚等需要对图片分类的场合</p>
                <a href="/query" class="btn btn-success">跳转至多目标预测</a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
